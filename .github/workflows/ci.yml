name: CI

# DISABLED — manual trigger only.
#
# GitHub refused to start jobs on 2026-08-29: "The job was not started because
# recent account payments have failed or your spending limit needs to be
# increased." Nothing was wrong with the code; both jobs were rejected before
# running a single step.
#
# Why it burned through the allowance so fast: this repo is private and macOS
# runners bill at a 10x minutes multiplier, so a 1-2 minute run costs 10-20
# billable minutes. Roughly 34 runs in one day is 300-600 minutes against a
# 2,000/month allowance.
#
# The workflow is kept rather than deleted -- it works, and it caught a real
# Windows-portability regression. To re-enable, fix billing (or make the repo
# public, where Actions minutes are free) and restore the push/pull_request
# triggers below.
#
# Until then the gate is local, and every agent already runs it before
# committing:
#
#     make check && make test && make build
#
# on:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core is a plain Swift package targeting macOS 14, so it builds and tests
  # on any runner GitHub offers today. This job is the one that must stay green.
  core:
    name: Core tests + purity guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: Packages/NotebarCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/NotebarCore/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test NotebarCore
        working-directory: Packages/NotebarCore
        run: swift test

      # Guards the constraint the M5 Windows port rests on: NotebarCore must not
      # import AppKit/SwiftUI/UIKit/Cocoa, and may only import CoreGraphics or
      # QuartzCore behind a `#if canImport(...)`. This caught a real regression
      # once already and was previously only run by hand via `make check`.
      - name: Core purity guard
        run: ./scripts/check-core-purity.sh

  # The app target requires the macOS 26 SDK. GitHub's hosted runners carry
  # macOS 26.5 (verified on run 33234440430 — newer than the 26.4 SDK on the
  # development machine), so this is a required job, not best-effort.
  app:
    name: App build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Available SDKs
        run: xcodebuild -showsdks | grep -i macos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Ad-hoc signing: CI has no Developer ID, and this build is only ever a
      # compile check. Real signing and notarization arrive with the release
      # workflow at M4.
      - name: Build
        run: |
          xcodebuild \
            -project Notebar.xcodeproj \
            -scheme Notebar \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
