name: CI

# Runs on every push to main and on pull requests.
#
# Was briefly disabled on 2026-08-29 when GitHub refused to start jobs over
# billing: this repo was private, and macOS runners bill at a 10x minutes
# multiplier, so a 1-2 minute run cost 10-20 billable minutes. Re-enabled after
# making the repo public, where Actions minutes are free.
#
# The same gate runs locally: make check && make test && make build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core is a plain Swift package targeting macOS 14, so it builds and tests
  # on any runner GitHub offers today. This job is the one that must stay green.
  core:
    name: Core tests + purity guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: Packages/NotebarCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/NotebarCore/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test NotebarCore
        working-directory: Packages/NotebarCore
        run: swift test

      # Guards the constraint the M5 Windows port rests on: NotebarCore must not
      # import AppKit/SwiftUI/UIKit/Cocoa, and may only import CoreGraphics or
      # QuartzCore behind a `#if canImport(...)`. This caught a real regression
      # once already and was previously only run by hand via `make check`.
      - name: Core purity guard
        run: ./scripts/check-core-purity.sh

  # The app target requires the macOS 26 SDK. GitHub's hosted runners carry
  # macOS 26.5 (verified on run 33234440430 — newer than the 26.4 SDK on the
  # development machine), so this is a required job, not best-effort.
  app:
    name: App build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Available SDKs
        run: xcodebuild -showsdks | grep -i macos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Ad-hoc signing: CI has no Developer ID, and this build is only ever a
      # compile check. Real signing and notarization arrive with the release
      # workflow at M4.
      - name: Build
        run: |
          xcodebuild \
            -project Notebar.xcodeproj \
            -scheme Notebar \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Proves the M5 Windows-port premise by compiling it, not just grepping for
  # forbidden imports: NotebarCore has to actually build and pass its tests
  # under Swift for Windows, not merely avoid Apple-only imports. Package.swift
  # gates NotebarStore/NotebarStoreTests (GRDB, AppKit) behind
  # `#if canImport(Darwin)`, so this runner only ever sees NotebarCore +
  # NotebarCoreTests.
  #
  # This job proves the core's logic compiles and behaves identically on
  # Windows. It does NOT prove a Windows app is buildable — see
  # docs/superpowers/notes/2026-08-29-windows-port.md for what still blocks
  # that (GRDB has no Windows target, and RTFD note bodies are an AppKit-only
  # format a Windows build cannot read at all).
  windows:
    name: Core tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than @main: a toolchain change should be a deliberate
      # commit here, not a surprise red build when Swift ships a new release.
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@v0.4.0
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE

      - name: Show toolchain
        run: swift --version

      - name: Test NotebarCore
        working-directory: Packages/NotebarCore
        run: swift test
        # swift-testing's own reporter prints "Test run with N tests in M
        # suites passed" — that count is the signal a regression dropped
        # tests rather than just failing to compile them.
