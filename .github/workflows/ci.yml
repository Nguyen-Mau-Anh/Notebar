name: CI

# Runs on every push to main and on pull requests.
#
# Was briefly disabled on 2026-08-29 when GitHub refused to start jobs over
# billing: this repo was private, and macOS runners bill at a 10x minutes
# multiplier, so a 1-2 minute run cost 10-20 billable minutes. Re-enabled after
# making the repo public, where Actions minutes are free.
#
# The same gate runs locally: make check && make test && make build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core is a plain Swift package targeting macOS 14, so it builds and tests
  # on any runner GitHub offers today. This job is the one that must stay green.
  core:
    name: Core tests + purity guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: Packages/NotebarCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/NotebarCore/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test NotebarCore
        working-directory: Packages/NotebarCore
        run: swift test

      # Guards the constraint the M5 Windows port rests on: NotebarCore must not
      # import AppKit/SwiftUI/UIKit/Cocoa, and may only import CoreGraphics or
      # QuartzCore behind a `#if canImport(...)`. This caught a real regression
      # once already and was previously only run by hand via `make check`.
      - name: Core purity guard
        run: ./scripts/check-core-purity.sh

  # The app target requires the macOS 26 SDK. GitHub's hosted runners carry
  # macOS 26.5 (verified on run 33234440430 — newer than the 26.4 SDK on the
  # development machine), so this is a required job, not best-effort.
  app:
    name: App build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Available SDKs
        run: xcodebuild -showsdks | grep -i macos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Ad-hoc signing: CI has no Developer ID, and this build is only ever a
      # compile check. Real signing and notarization arrive with the release
      # workflow at M4.
      - name: Build
        run: |
          xcodebuild \
            -project Notebar.xcodeproj \
            -scheme Notebar \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Proves the M5 Windows-port premise by compiling it, not just grepping for
  # forbidden imports: NotebarCore has to actually build and pass its tests
  # under Swift for Windows, not merely avoid Apple-only imports. Package.swift
  # gates NotebarStore/NotebarStoreTests (GRDB, AppKit) behind
  # `#if canImport(Darwin)`, so this runner only ever sees NotebarCore +
  # NotebarCoreTests.
  #
  # This job proves the core's logic compiles and behaves identically on
  # Windows. It does NOT prove a Windows app is buildable — see
  # docs/superpowers/notes/2026-08-29-windows-port.md for what still blocks
  # that (GRDB has no Windows target, and RTFD note bodies are an AppKit-only
  # format a Windows build cannot read at all).
  windows:
    name: Core tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than @main: a toolchain change should be a deliberate
      # commit here, not a surprise red build when Swift ships a new release.
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@v0.4.0
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE

      - name: Show toolchain
        run: swift --version

      - name: Test NotebarCore
        working-directory: Packages/NotebarCore
        run: swift test
        # swift-testing's own reporter prints "Test run with N tests in M
        # suites passed" — that count is the signal a regression dropped
        # tests rather than just failing to compile them. N is 46 here, not
        # the 153 the `core` job above reports: this manifest only declares
        # NotebarCoreTests on non-Apple platforms (NotebarStoreTests, the
        # other 107, needs GRDB and AppKit — see the job comment above). A
        # drop below 46 is the regression to watch for, not a drop below 153.

  # The riskiest unknown in the M5 Windows port: does a WinUI 3 MSIX actually
  # build and package unattended in CI. Notebar.Core/Notebar.Core.Tests are
  # cross-platform .NET and would pass on any runner; Notebar.App is
  # WinUI 3 and can only be built and packaged here, on windows-latest.
  windows-app:
    name: Windows app (C#)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # dotnet build alone won't drive single-project MSIX packaging: it
      # repeatedly produced "You must include a valid app package manifest
      # file named AppxManifest.xml in the source" because the Appx packaging
      # targets that generate AppxManifest.xml from Package.appxmanifest are
      # only reliably invoked through full desktop MSBuild, not the dotnet
      # SDK CLI's build driver.
      - uses: microsoft/setup-msbuild@v2

      # The cross-platform half. These carry the behaviour, so they run first
      # and a failure here stops the build before the slow MSIX step.
      - name: Test Notebar.Core
        run: dotnet test windows/Notebar.Core.Tests/Notebar.Core.Tests.csproj -c Release

      - name: Test Notebar.Store
        run: dotnet test windows/Notebar.Store.Tests/Notebar.Store.Tests.csproj -c Release

      - name: Core purity guard
        shell: bash
        run: windows/scripts/check-core-purity.sh

      # Everything below builds against the .sln, not the .csproj directly,
      # with restore as its own step — that's the exact pattern in
      # Microsoft's own "Set up continuous integration for your WinUI app"
      # doc (learn.microsoft.com/windows/apps/package-and-deploy/ci-for-winui3,
      # current as of 2026-08-30). Building the .csproj alone reproduced
      # "You must include a valid app package manifest file named
      # AppxManifest.xml in the source" across four different fixes
      # (RuntimeIdentifier, msbuild vs dotnet build, the AppxManifest/
      # Manifest/Content item group); switching the packaging build's entry
      # point to the solution, matching the documented example exactly, is
      # the one variable that example and our prior attempts didn't share.
      - name: Restore the solution
        run: msbuild windows/Notebar.sln /t:Restore /p:Configuration=Release

      - name: Build the WinUI app
        run: msbuild windows/Notebar.sln /p:Configuration=Release /p:Platform=x64

      # The primary distributable for v0.1.0: an unsigned MSIX needs an
      # Add-AppxPackage incantation from the user anyway, while a portable
      # self-contained zip needs no installation ceremony at all. This step
      # is unconditional and independent of the MSIX step below it, so a
      # packaging problem downstream can never leave the pipeline with an
      # empty artifact list.
      - name: Publish the portable build
        run: >
          dotnet publish windows/Notebar.App/Notebar.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:WindowsPackageType=None
          -o publish/portable

      - uses: actions/upload-artifact@v4
        with:
          name: notebar-windows-portable
          path: publish/portable/
          if-no-files-found: error

      # MSIX packaging (nice-to-have, not load-bearing now that the portable
      # zip above is the primary artifact). Every prior variant (default
      # target, csproj or sln, dotnet build or msbuild.exe, with the
      # AppxManifest/Manifest/Content item group present, across two
      # WindowsAppSDK major versions, /t:Build vs /t:Publish, with or without
      # an explicit RuntimeIdentifier or SelfContained) produced an empty
      # package.map.txt with no AppxManifest.xml ever staged — including
      # /t:Publish against the .csproj directly with RuntimeIdentifier and
      # SelfContained=true both set explicitly, which still left the build
      # output path RID-less. Trying once more without SelfContained=true:
      # an MSIX package is framework-dependent (the WindowsAppSDK bootstrapper
      # handles the runtime), so forcing a self-contained publish alongside
      # GenerateAppxPackageOnBuild may itself be what's derailing the target
      # graph. continue-on-error below means this costs nothing if it isn't.
      - name: Package MSIX
        id: package_msix
        continue-on-error: true
        run: >
          msbuild windows\Notebar.App\Notebar.App.csproj
          /restore
          /t:Publish
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxBundle=Never

      # Diagnostic only, not a fix: every documented configuration variant
      # tried before this (RuntimeIdentifier on/off, dotnet build vs msbuild,
      # csproj vs sln entry point, with/without the AppxManifest/Manifest/
      # Content item group, /t:Build vs /t:Publish without a publish profile)
      # produced the identical "You must include a valid app package
      # manifest file named AppxManifest.xml" failure. If this run's
      # /t:Publish + PublishProfile attempt also fails, this step prints
      # whether AppxManifest.xml exists anywhere in the intermediate output,
      # and what package.map.txt (the file MakeAppx actually reads)
      # contains.
      - name: Diagnose package layout on failure
        if: steps.package_msix.outcome == 'failure'
        shell: bash
        run: |
          echo "--- find: any AppxManifest.xml under Notebar.App ---"
          find windows/Notebar.App -iname 'AppxManifest.xml' || true
          echo "--- find: any package.map.txt ---"
          find windows/Notebar.App -iname 'package.map.txt' || true
          echo "--- contents of package.map.txt, if any ---"
          find windows/Notebar.App -iname 'package.map.txt' -exec cat {} \; || true
          echo "--- obj tree under Notebar.App (depth 6) ---"
          find windows/Notebar.App/obj -maxdepth 6 | sort || true
          echo "--- Package.appxmanifest source file ---"
          ls -la windows/Notebar.App/Package.appxmanifest || true

      # Nice-to-have, not load-bearing: if-no-files-found is "warn" here,
      # not "error", because Package MSIX above has continue-on-error: true.
      # The portable zip published earlier is the artifact that must never
      # be silently empty; this one is allowed to come up empty while it's
      # still an open follow-up.
      - name: Collect the package
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          find windows/Notebar.App -name '*.msix' -exec cp {} artifacts/ \;
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: notebar-windows-msix
          path: artifacts/
          if-no-files-found: warn
